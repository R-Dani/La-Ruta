<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Ruta</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <nav class="navbar main-header">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-text header-title">La Ruta</span>
        <a class="navbar-brand m-0 p-0" href="#">
          <img src="assets/la-calabaza.svg" alt="Logo Calabaza" class="header-logo">
        </a>
      </div>
    </nav>
  </header>
  
<aside>
<div class="wrapper">

    <!-- Aquí se carga el sidebar -->
    <div id="sidebar-container"></div>

    <!-- Contenido principal -->
    <div id="content">
      <nav class="navbar bg-light shadow-sm">
        <button id="sidebarCollapse" class="btn btn-dark">
          <i class="bi bi-list"></i>
        </button>
      </nav>
    </div>
  </div>
</aside>
  

  <!-- jQuery (requerido por Bootstrap 4) -->
  <script src="js/jquery.slim.min.js"></script>
  <!-- Bootstrap JS Bundle (incluye Popper.js) -->
  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
