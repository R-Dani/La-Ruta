<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Ruta</title>

  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Encabezado de la aplicación -->
  <header>
    <nav class="navbar main-header">
      <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-text header-title">La Ruta</span>
        <a class="navbar-brand m-0 p-0" href="index.html" aria-label="Ir al inicio">
          <img src="assets/la-calabaza.svg" alt="Logo La Ruta" class="header-logo">
        </a>
      </div>
    </nav>
  </header>

  <!-- Contenedor principal de la aplicación -->
  <div class="wrapper">
    <!-- Barra lateral (cargada dinámicamente desde sidebar.html) -->
    <aside id="sidebar-container" aria-label="Menú de navegación lateral"></aside>

    <!-- Contenido principal y visor cartográfico -->
    <main id="content">
      <nav class="navbar content-navbar bg-white border-bottom shadow-sm">
        <div class="container-fluid">
          <button id="sidebarCollapse" class="btn btn-dark" type="button" aria-label="Alternar menú lateral"
            aria-controls="sidebar" aria-expanded="true" title="Alternar menú lateral">
            <i class="bi bi-list"></i>
          </button>
        </div>
      </nav>

      <!-- Sección del mapa Leaflet -->
      <section id="map-container" aria-label="Mapa interactivo de la ruta">
        <div id="map"></div>
      </section>
    </main>
  </div>

  <!-- Scripts funcionales -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/rutaData.js"></script>
  <script src="js/map.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
